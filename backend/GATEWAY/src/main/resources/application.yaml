server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:file:.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          routes:
            - id: loginApi
              uri: lb://login-service
              predicates:
                - Path=/api/auth/**, /auth/**

            - id: chamadoApi
              uri: lb://chamado-service
              predicates:
                - Path=/chamados/**, /api/chamados/**

            - id: tecnicoApi
              uri: lb://chamado-service
              predicates:
                - Path=/tecnicos/**, /api/tecnicos/**

            - id: mensageriaApi
              uri: lb://mensageria-service
              predicates:
                - Path=/mensageria/**, /api/mensageria/**

    discovery:
      client:
        simple:
          instances:
            login-service:
              - uri: ${LOGIN_URL:http://localhost:8083}
            chamado-service:
              - uri: ${CHAMADO_URL:http://localhost:8081}
            mensageria-service:
              - uri: ${MENSAGERIA_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:minha-chave-secreta-super-segura-jwt-fatec-2026-com-ao-menos-256-bits!}

cookie:
  nome: ${COOKIE_NOME:tokenAgendaFlow}

cors:
  origens:
    - "http://localhost:8081"
    - "http://localhost:19006"
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:8081"
    - "http://127.0.0.1:5500"